<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP Fraud Detection Console</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --low-risk: #22c55e;
            --med-risk: #eab308;
            --high-risk: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
        }

        h2 {
            margin-top: 0;
            font-size: 1.25rem;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            color: var(--text-sub);
            margin-top: 1rem;
            margin-bottom: 0.25rem;
            display: block;
        }

        input, textarea {
            width: 100%;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-main);
            padding: 0.75rem;
            box-sizing: border-box;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            height: 120px;
        }

        button {
            margin-top: 1.25rem;
            background-color: var(--accent);
            color: #0f172a;
            font-weight: bold;
            border: none;
            padding: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.85rem;
            text-align: center;
        }

        .badge-LOW { background-color: var(--low-risk); color: #000; }
        .badge-MEDIUM { background-color: var(--med-risk); color: #000; }
        .badge-HIGH { background-color: var(--high-risk); color: #fff; }

        .metric-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px dashed var(--border);
        }

        .tokens-list, .rules-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .token-tag {
            background-color: #334155;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        #rawOutput {
            font-family: monospace;
            font-size: 0.8rem;
            background: #0f172a;
            padding: 0.5rem;
            border-radius: 4px;
            overflow-x: auto;
            max-height: 150px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Input Form Panel -->
    <div class="panel">
        <h2>Payload Tester</h2>
        
        <label for="txId">Transaction ID</label>
        <input type="text" id="txId" value="tx_test_505">

        <label for="rawText">Raw Transaction Text</label>
        <textarea id="rawText">URGENT: Please wire $2,500 immediately to account 987654321 to claim your lottery prize!</textarea>

        <button onclick="analyzeText()">Run Detection</button>
    </div>

    <!-- Results Display Panel -->
    <div class="panel">
        <h2>Analysis Results</h2>
        
        <div id="resultsContainer" style="display: none;">
            <div class="metric-row">
                <span>Risk Level:</span>
                <span id="riskLevel" class="badge">--</span>
            </div>
            
            <div class="metric-row">
                <span>Decision Action:</span>
                <strong id="action">--</strong>
            </div>

            <div class="metric-row">
                <span>Final Combined Score:</span>
                <strong id="finalScore">--</strong>
            </div>

            <div class="metric-row">
                <span>Rule Score / Model Score:</span>
                <span id="scoreBreakdown">-- / --</span>
            </div>

            <label>Sanitized Text (PII Masked)</label>
            <div id="sanitizedText" style="font-size: 0.9rem; color: #cbd5e1; font-style: italic;">--</div>

            <label>Triggered High-Risk Tokens</label>
            <div id="tokensList" class="tokens-list"></div>

            <label>Raw API Response</label>
            <pre id="rawOutput"></pre>
        </div>

        <div id="placeholder" style="color: var(--text-sub); text-align: center; margin: 0;">
            Submit a request to display pipeline outputs.
        </div>
    </div>
</div>

<script>
    async function analyzeText() {
        const txId = document.getElementById('txId').value;
        const rawText = document.getElementById('rawText').value;

        try {
            const response = await fetch('/api/v1/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    transaction_id: txId,
                    raw_text: rawText
                })
            });

            if (!response.ok) {
                throw new Error(`HTTP Error: ${response.status}`);
            }

            const data = await response.json();

            // Hide placeholder, show results
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('resultsContainer').style.display = 'block';

            // Populate summary metrics
            const riskBadge = document.getElementById('riskLevel');
            riskBadge.innerText = data.risk_level;
            riskBadge.className = `badge badge-${data.risk_level}`;

            document.getElementById('action').innerText = data.action;
            document.getElementById('finalScore').innerText = (data.final_score * 100).toFixed(1) + '%';
            document.getElementById('scoreBreakdown').innerText = `${data.rule_score} / ${data.model_score}`;
            document.getElementById('sanitizedText').innerText = data.sanitized_text;

            // Populate high-risk tokens
            const tokensContainer = document.getElementById('tokensList');
            tokensContainer.innerHTML = '';
            if (data.high_risk_tokens && data.high_risk_tokens.length > 0) {
                data.high_risk_tokens.forEach(token => {
                    const tag = document.createElement('span');
                    tag.className = 'token-tag';
                    tag.innerText = token;
                    tokensContainer.appendChild(tag);
                });
            } else {
                tokensContainer.innerHTML = '<span style="font-size:0.8rem; color: #64748b;">None</span>';
            }

            // Raw response formatted preview
            document.getElementById('rawOutput').innerText = JSON.stringify(data, null, 2);

        } catch (err) {
            alert('Failed to analyze payload: ' + err.message);
        }
    }
</script>

</body>
</html>
